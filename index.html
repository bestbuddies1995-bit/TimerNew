<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Sit/Stand Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #FFFFFF;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 10px;
      user-select: none;
    }
    .card {
      background: #1E1E1E;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .status {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status.sitzen { color: #4CAF50; }
    .status.stehen { color: #FF9800; }
    
    .timer-display {
      font-size: 2.8rem;
      font-weight: bold;
      font-family: monospace;
      margin: 10px 0;
    }
    .stats {
      font-size: 0.85rem;
      color: #AAAAAA;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      padding: 8px 0;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      background: #333333;
      color: #FFF;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #444444;
    }
    button.primary {
      background: #007ACC;
    }
    button.primary:hover {
      background: #005999;
    }
    button.danger {
      background: #D32F2F;
    }
    button.danger:hover {
      background: #9A0007;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="status" class="status sitzen">Sitzen</div>
    <div id="timer" class="timer-display">25:00</div>

    <div class="stats">
      <div>Heute gesessen:<br><strong id="total-sit">0m</strong></div>
      <div>Heute gestanden:<br><strong id="total-stand">0m</strong></div>
    </div>

    <div class="controls">
      <button id="toggle-btn" class="primary" onclick="toggleTimer()">Start</button>
      <button class="danger" onclick="resetDay()">Reset Tag</button>
    </div>
  </div>

  <script>
    // Feste Intervall-Zeiten in Sekunden
    const SIT_DURATION = 25 * 60; // 25 Minuten Sitzen
    const STAND_DURATION = 15 * 60; // 15 Minuten Stehen

    let mode = 'sitzen'; // 'sitzen' oder 'stehen'
    let timeLeft = SIT_DURATION;
    let isRunning = false;
    let timerInterval = null;

    let totalSitSeconds = 0;
    let totalStandSeconds = 0;

    // URL-Parameter lesen (Crash-Schutz für iCUE)
    function loadFromURL() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('sit')) totalSitSeconds = parseInt(params.get('sit'), 10) || 0;
      if (params.has('stand')) totalStandSeconds = parseInt(params.get('stand'), 10) || 0;
      if (params.has('mode')) mode = params.get('mode') || 'sitzen';
      if (params.has('left')) timeLeft = parseInt(params.get('left'), 10) || (mode === 'sitzen' ? SIT_DURATION : STAND_DURATION);
      updateDisplay();
    }

    // Aktuellen Stand geräuschlos in der URL sichern
    function saveToURL() {
      const newURL = window.location.pathname + `?sit=${totalSitSeconds}&stand=${totalStandSeconds}&mode=${mode}&left=${timeLeft}`;
      window.history.replaceState(null, '', newURL);
    }

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      document.getElementById('timer').innerText = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      const statusEl = document.getElementById('status');
      statusEl.innerText = mode;
      statusEl.className = `status ${mode}`;

      document.getElementById('total-sit').innerText = `${Math.floor(totalSitSeconds / 60)}m`;
      document.getElementById('total-stand').innerText = `${Math.floor(totalStandSeconds / 60)}m`;
    }

    function toggleTimer() {
      const btn = document.getElementById('toggle-btn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        btn.innerText = 'Start';
      } else {
        isRunning = true;
        btn.innerText = 'Pause';
        timerInterval = setInterval(tick, 1000);
      }
      saveToURL();
    }

    function tick() {
      if (timeLeft > 0) {
        timeLeft--;
        if (mode === 'sitzen') {
          totalSitSeconds++;
        } else {
          totalStandSeconds++;
        }
      } else {
        // Wechsel zwischen Sitzen und Stehen
        if (mode === 'sitzen') {
          mode = 'stehen';
          timeLeft = STAND_DURATION;
        } else {
          mode = 'sitzen';
          timeLeft = SIT_DURATION;
        }
      }
      updateDisplay();
      saveToURL();
    }

    function resetDay() {
      if (isRunning) toggleTimer();
      totalSitSeconds = 0;
      totalStandSeconds = 0;
      mode = 'sitzen';
      timeLeft = SIT_DURATION;
      updateDisplay();
      saveToURL();
    }

    // Beim Starten Zustand laden
    loadFromURL();
  </script>
</body>
</html>
